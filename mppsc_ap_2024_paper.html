        let questions = [];
        
        function parseQuestions() {
            // Clean up the text by removing noise like page numbers, subject headers, and PTO markers
            let cleanedText = rawOcrText
                .replace(/\[Page \d+\].*/g, '')
                .replace(/COMPUTER SCIENCE/g, '')
                .replace(/CS\/2025-D/g, '')
                .replace(/\[P\.T\.O\.\]/g, '')
                .replace(/\n\s*\d+\s*\n/g, '\n') // Remove stray page numbers
                .trim();

            // Split the text into blocks based on pattern "\nNumber. " or start of string "Number. "
            const qBlocks = cleanedText.split(/(?=\n\d+\.\s+)|(?=^\d+\.\s+)/m);

            qBlocks.forEach(block => {
                block = block.trim();
                if(!block) return;

                // Match question number and the rest of the block
                const numMatch = block.match(/^(\d+)\.\s+([\s\S]*)/);
                if (numMatch) {
                    const id = parseInt(numMatch[1], 10);
                    let content = numMatch[2];

                    // Separate question text from options
                    // Look for (A), (B), (C), (D)
                    const optionRegex = /\(([A-D])\)\s*([\s\S]*?)(?=\([A-D]\)|$)/g;
                    
                    let options = {};
                    let match;
                    let lastIndex = 0;
                    let firstOptionIndex = -1;

                    while ((match = optionRegex.exec(content)) !== null) {
                        if (firstOptionIndex === -1) {
                            firstOptionIndex = match.index;
                        }
                        options[match[1]] = match[2].trim().replace(/\n/g, ' ');
                    }

                    let questionText = "";
                    if (firstOptionIndex !== -1) {
                        questionText = content.substring(0, firstOptionIndex).trim();
                    } else {
                        // Edge case if parsing fails, just dump content
                        questionText = content.trim();
                    }

                    // Format question text slightly (replace newlines within sentences)
                    questionText = questionText.replace(/([a-z,])\n([a-z])/ig, '$1 $2');

                    // If question exists in answer key, add it
                    // Sometimes OCR misses a question, we only add 1-150
                    if (id >= 1 && id <= 150) {
                        // Some missing questions in OCR might be padded empty if needed, but we rely on what was parsed
                        questions.push({
                            id: id,
                            text: questionText,
                            options: options,
                            correct: answerKey[id] || []
                        });
                    }
                }
            });

            // Sort just to be sure
            questions.sort((a, b) => a.id - b.id);
            
            // Check if we missed any up to 150 (since OCR might have skipped)
            // For a robust app, we should fill in blanks if ID is missing up to 150
            let completeQuestions = [];
            for (let i = 1; i <= 150; i++) {
                let found = questions.find(q => q.id === i);
                if (found) {
                    completeQuestions.push(found);
                } else {
                    completeQuestions.push({
                        id: i,
                        text: "Question text could not be extracted perfectly. Please refer to original document.",
                        options: { A: "Option A", B: "Option B", C: "Option C", D: "Option D" },
                        correct: answerKey[i] || []
                    });
                }
            }
            questions = completeQuestions;
        }

        let currentIdx = 0;
        let userAnswers = {}; // map of id -> array of selected letters ['A', 'C']
        let isSubmitted = false;
        let revealedAnswers = {}; // map of id -> boolean for "Show Answer" feature

        const DOM = {
            loading: document.getElementById('loading-state'),
            quiz: document.getElementById('quiz-container'),
            results: document.getElementById('results-container'),
            grid: document.getElementById('question-grid'),
            qNum: document.getElementById('q-number'),
            qStatus: document.getElementById('q-status'),
            qText: document.getElementById('q-text'),
            options: document.getElementById('options-container'),
            solutionSection: document.getElementById('solution-section'),
            solutionText: document.getElementById('solution-text'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            btnShowAnswer: document.getElementById('btn-show-answer'),
            btnSubmit: document.getElementById('btn-submit-top'),
            progressText: document.getElementById('progress-text'),
            sidebar: document.getElementById('sidebar'),
            btnOpenSidebar: document.getElementById('btn-open-sidebar'),
            btnCloseSidebar: document.getElementById('btn-close-sidebar'),
        };

        function initApp() {
            parseQuestions();
            DOM.loading.classList.add('hidden');
            DOM.quiz.classList.remove('hidden');
            
            buildGrid();
            renderQuestion(currentIdx);
            updateProgress();

            // Event Listeners
            DOM.btnNext.addEventListener('click', () => {
                if (currentIdx < questions.length - 1) {
                    currentIdx++;
                    renderQuestion(currentIdx);
                }
            });

            DOM.btnPrev.addEventListener('click', () => {
                if (currentIdx > 0) {
                    currentIdx--;
                    renderQuestion(currentIdx);
                }
            });

            DOM.btnShowAnswer.addEventListener('click', () => {
                const q = questions[currentIdx];
                revealedAnswers[q.id] = true;
                renderQuestion(currentIdx);
            });

            DOM.btnSubmit.addEventListener('click', submitQuiz);
            document.getElementById('btn-review').addEventListener('click', () => {
                DOM.results.classList.add('hidden');
                DOM.quiz.classList.remove('hidden');
                renderQuestion(currentIdx); // Re-render in review mode
            });

            DOM.btnOpenSidebar.addEventListener('click', () => DOM.sidebar.classList.remove('-translate-x-full'));
            DOM.btnCloseSidebar.addEventListener('click', () => DOM.sidebar.classList.add('-translate-x-full'));
        }

        function buildGrid() {
            DOM.grid.innerHTML = '';
            questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `grid-btn-${q.id}`;
                btn.className = `w-10 h-10 rounded text-sm font-medium border flex items-center justify-center transition
                                ${userAnswers[q.id] ? 'bg-blue-500 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`;
                btn.innerText = q.id;
                btn.onclick = () => {
                    currentIdx = idx;
                    renderQuestion(currentIdx);
                    if(window.innerWidth < 768) DOM.sidebar.classList.add('-translate-x-full'); // auto close on mobile
                };
                DOM.grid.appendChild(btn);
            });
        }

        function updateGridStatus(id) {
            const btn = document.getElementById(`grid-btn-${id}`);
            if(!btn) return;
            
            if (isSubmitted) {
                const q = questions.find(q => q.id === id);
                if (q.correct.includes('Delete')) {
                    btn.className = `w-10 h-10 rounded text-sm font-medium border flex items-center justify-center bg-purple-100 text-purple-700 border-purple-300`;
                } else if (!userAnswers[id] || userAnswers[id].length === 0) {
                    btn.className = `w-10 h-10 rounded text-sm font-medium border flex items-center justify-center bg-gray-100 text-gray-500 border-gray-300`;
                } else {
                    const isCorrect = checkAnswer(q.correct, userAnswers[id]);
                    if (isCorrect) {
                        btn.className = `w-10 h-10 rounded text-sm font-medium border flex items-center justify-center bg-green-500 text-white border-green-600`;
                    } else {
                        btn.className = `w-10 h-10 rounded text-sm font-medium border flex items-center justify-center bg-red-500 text-white border-red-600`;
                    }
                }
            } else {
                if (userAnswers[id] && userAnswers[id].length > 0) {
                    btn.className = `w-10 h-10 rounded text-sm font-medium border flex items-center justify-center bg-blue-500 text-white border-blue-600`;
                } else {
                    btn.className = `w-10 h-10 rounded text-sm font-medium border flex items-center justify-center bg-white text-gray-600 border-gray-300 hover:bg-gray-50`;
                }
            }
            
            // Highlight current
            Array.from(DOM.grid.children).forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-gray-800'));
            document.getElementById(`grid-btn-${questions[currentIdx].id}`).classList.add('ring-2', 'ring-offset-1', 'ring-gray-800');
        }

        function renderQuestion(idx) {
            const q = questions[idx];
            DOM.qNum.innerText = `Question ${q.id}`;
            DOM.qText.innerText = q.text;
            
            const isDeleted = q.correct.includes('Delete');
            const isRevealed = revealedAnswers[q.id];
            const showResults = isSubmitted || isRevealed;
            
            if(isDeleted) {
                DOM.qStatus.innerText = "Deleted Question";
                DOM.qStatus.className = "text-xs font-semibold px-2 py-1 rounded bg-purple-100 text-purple-700";
            } else if (userAnswers[q.id]) {
                DOM.qStatus.innerText = "Answered";
                DOM.qStatus.className = "text-xs font-semibold px-2 py-1 rounded bg-blue-100 text-blue-700";
            } else {
                DOM.qStatus.innerText = "Unanswered";
                DOM.qStatus.className = "text-xs font-semibold px-2 py-1 rounded bg-gray-100 text-gray-600";
            }

            DOM.btnPrev.disabled = idx === 0;
            DOM.btnNext.disabled = idx === questions.length - 1;

            DOM.options.innerHTML = '';
            
            if (isDeleted && !isSubmitted) {
                DOM.options.innerHTML = `<div class="p-4 bg-purple-50 text-purple-700 rounded-lg border border-purple-200">This question was marked as 'Delete' in the answer key. It will not be graded.</div>`;
            } else {
                const multiCorrect = q.correct.length > 1 && !isDeleted;
                
                ['A', 'B', 'C', 'D'].forEach(letter => {
                    if(!q.options[letter]) return; // Skip if parsing missed it (rare)
                    
                    const isSelected = userAnswers[q.id]?.includes(letter);
                    const isActualCorrect = q.correct.includes(letter);
                    
                    let modeClasses = "bg-white border-gray-300 text-gray-700 hover:border-blue-400 cursor-pointer";
                    let iconHTML = `<div class="w-5 h-5 rounded${multiCorrect? '':' -full'} border border-gray-300 flex items-center justify-center mr-3 mt-0.5 shrink-0 bg-white"></div>`;
                    
                    if (isSelected && !showResults) {
                        modeClasses = "selected-option";
                        iconHTML = `<div class="w-5 h-5 rounded${multiCorrect? '':' -full'} border border-blue-600 flex items-center justify-center mr-3 mt-0.5 shrink-0 bg-blue-600 text-white text-xs"><i class="fa-solid fa-check"></i></div>`;
                    }

                    if (showResults) {
                        modeClasses = "bg-white border-gray-200 text-gray-500 opacity-70 cursor-default";
                        if (isActualCorrect) {
                            modeClasses = "correct-option opacity-100 font-medium";
                            iconHTML = `<div class="w-5 h-5 rounded${multiCorrect? '':' -full'} border border-green-600 flex items-center justify-center mr-3 mt-0.5 shrink-0 bg-green-600 text-white text-xs"><i class="fa-solid fa-check"></i></div>`;
                        } else if (isSelected && !isActualCorrect) {
                            modeClasses = "wrong-option opacity-100";
                            iconHTML = `<div class="w-5 h-5 rounded${multiCorrect? '':' -full'} border border-red-600 flex items-center justify-center mr-3 mt-0.5 shrink-0 bg-red-600 text-white text-xs"><i class="fa-solid fa-times"></i></div>`;
                        }
                    }

                    const optDiv = document.createElement('div');
                    optDiv.className = `option-label p-4 rounded-xl border-2 transition flex items-start ${modeClasses}`;
                    optDiv.innerHTML = `
                        ${iconHTML}
                        <div>
                            <span class="font-bold mr-2 text-sm">${letter}.</span>
                            <span class="text-[15px]">${q.options[letter]}</span>
                        </div>
                    `;

                    if (!showResults && !isDeleted) {
                        optDiv.onclick = () => handleOptionClick(q.id, letter, multiCorrect);
                    }
                    DOM.options.appendChild(optDiv);
                });
                
                // Show multiple choice hint
                if(multiCorrect && !showResults) {
                    const hint = document.createElement('div');
                    hint.className = "text-xs text-gray-500 italic mt-2";
                    hint.innerText = "*This question allows multiple selections.";
                    DOM.options.appendChild(hint);
                }
            }

            // Handle Show Answer Button visibility
            if (showResults || isDeleted) {
                DOM.btnShowAnswer.classList.add('hidden');
            } else {
                DOM.btnShowAnswer.classList.remove('hidden');
            }

            // Handle Solution Section visibility
            if (showResults && !isDeleted) {
                DOM.solutionSection.classList.remove('hidden');
                DOM.solutionText.innerHTML = solutionsRaw[q.id] || "<em>No explanation provided yet. You can add one in the <code>solutionsRaw</code> object in the code.</em>";
            } else {
                DOM.solutionSection.classList.add('hidden');
            }

            updateGridStatus(q.id);
            updateProgress();
        }

        function handleOptionClick(qId, letter, multi) {
            if (!userAnswers[qId]) userAnswers[qId] = [];
            
            if (multi) {
                // Toggle
                if (userAnswers[qId].includes(letter)) {
                    userAnswers[qId] = userAnswers[qId].filter(l => l !== letter);
                } else {
                    userAnswers[qId].push(letter);
                }
            } else {
                // Single select
                userAnswers[qId] = [letter];
            }
            
            if (userAnswers[qId].length === 0) delete userAnswers[qId];
            
            renderQuestion(currentIdx);
        }

        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            DOM.progressText.innerText = `${answeredCount} / 150 Answered`;
            
            if(isSubmitted) {
                DOM.progressText.innerText = "Review Mode";
            }
        }

        function checkAnswer(correctArr, userArr) {
            if(!userArr || userArr.length === 0) return false;
            if(correctArr.includes('Delete')) return false; // Handled separately
            
            // For this quiz, if a question has multiple answers in the key (e.g., C, D), 
            // usually selecting either gives full marks, or both are needed. 
            // We will count it correct if the user's selection matches EXACTLY the required set, 
            // OR if it's a "Select any one of these" scenario, we check if user's single choice is IN the correct array.
            // Let's assume strict matching: user must select ALL correct options and NO wrong options.
            // Exception: If user selected 'C' and answer is 'C, D', usually it's considered partially correct or fully correct depending on exam. 
            // We will do strict equal set for highest accuracy.
            
            const sortedCorrect = [...correctArr].sort().join(',');
            const sortedUser = [...userArr].sort().join(',');
            
            return sortedCorrect === sortedUser;
        }

        function submitQuiz() {
            if(!confirm("Are you sure you want to submit the exam?")) return;
            
            isSubmitted = true;
            DOM.btnSubmit.classList.add('hidden');
            DOM.quiz.classList.add('hidden');
            DOM.results.classList.remove('hidden');

            let score = 0;
            let correct = 0;
            let wrong = 0;
            let skipped = 0;
            let deleted = 0;

            questions.forEach(q => {
                if (q.correct.includes('Delete')) {
                    deleted++;
                } else {
                    const uAns = userAnswers[q.id];
                    if (!uAns || uAns.length === 0) {
                        skipped++;
                    } else {
                        if (checkAnswer(q.correct, uAns)) {
                            correct++;
                            score++;
                        } else {
                            wrong++;
                        }
                    }
                }
                updateGridStatus(q.id); // Update grid colors to show results
            });

            const gradableTotal = questions.length - deleted;
            const percentage = gradableTotal > 0 ? Math.round((score / gradableTotal) * 100) : 0;

            document.getElementById('score-text').innerText = score;
            document.getElementById('total-score-text').innerText = gradableTotal;
            document.getElementById('percent-text').innerText = `${percentage}%`;
            
            document.getElementById('res-correct').innerText = correct;
            document.getElementById('res-wrong').innerText = wrong;
            document.getElementById('res-skipped').innerText = skipped;
            document.getElementById('res-deleted').innerText = deleted;
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            // Small delay to let browser render loading UI before heavy regex parsing
            setTimeout(initApp, 100);
        });

    </script>
</body>
</html>
